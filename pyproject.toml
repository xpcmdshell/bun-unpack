[project]
name = "bun-unpack"
version = "0.2.0"
description = "Extract bundled JavaScript/TypeScript files from Bun compiled executables"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "zstandard>=0.25.0",
]

[project.scripts]
bun-unpack = "bun_unpack.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bun_unpack"]

[tool.ruff]
target-version = "py310"
line-length = 96

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]
