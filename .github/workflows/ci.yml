name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v3
      - name: Install
        run: uv sync --frozen
      - name: Test
        shell: bash
        env:
          BUN_UNPACK_REQUIRE_FIXTURES: "1"
        run: |
          uv run python -m tools.build_compatibility
          uv run python -m unittest discover -s tests -v
