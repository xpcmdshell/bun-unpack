name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
          python-version: "3.15"
      - name: Install
        run: uv sync --locked
      - name: Check formatting, lint, and types
        run: uv run --locked prek run --all-files

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
          python-version: ${{ matrix.python }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install
        run: uv sync --locked
      - name: Test source recovery and installed distributions
        shell: bash
        env:
          BUN_UNPACK_REQUIRE_FIXTURES: "1"
        run: |
          uv run --locked python -m tools.build_compatibility
          uv run --locked python -m pytest
      - name: Preserve failing compatibility fixtures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-${{ matrix.os }}-python-${{ matrix.python }}
          retention-days: 3
          compression-level: 9
          path: |
            build/compatibility/fixtures/0.6.0/assets/
            build/compatibility/fixtures/1.0.0/assets/
            build/compatibility/fixtures/1.1.0/assets/
            build/compatibility/fixtures/1.1.22/sources/
            build/compatibility/fixtures/1.1.30/sources/
