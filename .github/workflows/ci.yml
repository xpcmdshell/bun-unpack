name: ci

on:
  push:
  pull_request:

env:
  UV_PYTHON: "3.10"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v3
      - name: Install
        run: uv sync --locked
      - name: Check formatting
        run: uv run --locked ruff format --check src tests tools
      - name: Lint
        run: uv run --locked ruff check src tests tools

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v3
      - name: Install
        run: uv sync --locked
      - name: Test
        shell: bash
        env:
          BUN_UNPACK_REQUIRE_FIXTURES: "1"
        run: |
          uv run --locked python -m tools.build_compatibility
          uv run --locked python -m unittest discover -s tests -v
      - name: Preserve failing compatibility fixtures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-${{ matrix.os }}
          retention-days: 3
          compression-level: 9
          path: |
            build/compatibility/fixtures/0.6.0/assets/
            build/compatibility/fixtures/1.0.0/assets/
            build/compatibility/fixtures/1.1.0/assets/
            build/compatibility/fixtures/1.1.22/sources/
            build/compatibility/fixtures/1.1.30/sources/
